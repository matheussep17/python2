<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Painel | Igreja</title><link rel="stylesheet" href="admin.css"></head><body><header><a class="brand" href="index.html">✦ <strong>Igreja.</strong></a><a href="index.html">Ver site público ↗</a></header><main><div class="intro"><p>PAINEL ADMINISTRATIVO</p><h1>Conteúdo da igreja</h1><span>Organize a agenda, a biblioteca e os pedidos recebidos.</span></div><nav class="tabs"><button class="active" data-tab="events">Agenda de eventos</button><button data-tab="media">Biblioteca de mídia</button><button data-tab="messages">Mensagens recebidas</button></nav><section id="events" class="panel active"><form id="event-form"><input name="title" required placeholder="Nome do evento"><input name="date" required placeholder="Data · ex.: 15 JUN"><input name="category" placeholder="Categoria · ex.: Famílias"><input name="description" required placeholder="Descrição curta"><button>Adicionar evento</button></form><div id="event-list"></div></section><section id="media" class="panel"><form id="media-form"><input name="title" required placeholder="Título da mídia"><select name="type"><option value="video">Vídeo</option><option value="audio">Áudio</option><option value="pdf">PDF</option></select><input name="detail" required placeholder="Detalhe · ex.: Mensagem · 42 min"><button>Adicionar mídia</button></form><div id="admin-media-list"></div></section><section id="messages" class="panel"><div id="message-list"></div></section></main><script src="admin.js"></script></body></html>
